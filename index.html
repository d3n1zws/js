
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="numbers">
        <div class="pink">
            <div class="first" draggable="true">1</div>
            <div class="first" draggable="true">2</div>
            <div class="first" draggable="true">3</div>
            <div class="first" draggable="true">4</div>
        </div>

        <div class="purple">
            <div class="second" draggable="true">5</div>
            <div class="second" draggable="true">6</div>
            <div class="second" draggable="true">7</div>
            <div class="second" draggable="true">8</div>
        </div>

        <div class="blue">
            <div class="third" draggable="true">9</div>
            <div class="third" draggable="true">10</div>
            <div class="third" draggable="true">11</div>
            <div class="third" draggable="true">12</div>
        </div>
    </div>

    <div class="rectangles">
        <div class="rectangle pink-bg"></div>
        <div class="rectangle purple-bg"></div>
        <div class="rectangle blue-bg"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
